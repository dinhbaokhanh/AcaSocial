services:
  # ===== Infrastructure =====

  postgres:
    image: postgres:16-alpine
    container_name: acasocial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - '5432:5432'
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: acasocial-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: acasocial-nats
    restart: unless-stopped
    command: ['-js', '-m', '8222']
    ports:
      - '4222:4222'
      - '8222:8222'
    networks:
      - internal
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q --spider http://localhost:8222/healthz || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Services =====

  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    container_name: acasocial-identity
    restart: unless-stopped
    env_file:
      - ./services/identity-service/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-your_internal_service_token}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ===== Gateway =====

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: acasocial-gateway
    restart: unless-stopped
    env_file:
      - ./gateway/.env
    environment:
      REDIS_URL: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      MEDIA_SERVICE_URL: http://media-service:8082
      DISCUSSION_SERVICE_URL: http://discussion-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    ports:
      - '8080:8080'
    networks:
      - internal
    depends_on:
      - identity-service
      - media-service
      - discussion-service

  media-service:
    build:
      context: ./services/media-service
      dockerfile: Dockerfile
    container_name: acasocial-media
    restart: unless-stopped
    env_file:
      - ./services/media-service/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  discussion-service:
    build:
      context: ./services/discussion-service
      dockerfile: Dockerfile
    container_name: acasocial-discussion
    restart: unless-stopped
    env_file:
      - ./services/discussion-service/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: acasocial-notification
    restart: unless-stopped
    env_file:
      - ./services/notification-service/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      NATS_URL: nats://nats:4222
    ports:
      - '8085:8085'
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

# ===== Volumes =====
volumes:
  postgres_data:
  redis_data:

# ===== Networks =====
networks:
  internal:
    driver: bridge
