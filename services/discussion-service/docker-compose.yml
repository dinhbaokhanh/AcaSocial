version: '3.8'

services:
  discussion-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acasocial-discussion-service
    ports:
      - "8084:8084"
    environment:
      - NATS_URL=nats://nats:4222
      - PORT=8084
      - DB_HOST=discussion-db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=123456
      - DB_NAME=discussion_db
    depends_on:
      nats:
        condition: service_started
      discussion-db:
        condition: service_healthy
    networks:
      - acasocial-network
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    networks:
      - acasocial-network

  discussion-db:
    image: postgres:15-alpine
    container_name: acasocial-discussion-db
    ports:
      - "5434:5432" # Map ra host port 5434 để tránh đụng độ
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=discussion_db
    volumes:
      - discussion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d discussion_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - acasocial-network
    restart: unless-stopped

networks:
  acasocial-network:
    driver: bridge

volumes:
  discussion_pgdata:
